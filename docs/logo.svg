<!-- An oak leaf: the terminal lobe, four pairs under it, the stalk. Every lobe is a round shape softly joined to a tapering core, so a sinus curves where two of them meet rather than notching. The mark is a golden rectangle - sixteen units across, twenty-six tall - centred in a field of thirty-two. Nord polar night behind; the leaf takes currentColor, which the banner sets from the accent in oak.yaml. -->
