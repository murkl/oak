# Static analysis that follows a value across functions, which is the one thing
# vet and staticcheck do not do.
#
# Not part of CI: a finding here belongs in the security tab, not in the way of
# a release. It runs on what is about to be released and weekly on what already
# is — a vulnerability found last Tuesday is news about code that has not
# changed since.

name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - run: make build

      - uses: github/codeql-action/analyze@v4
