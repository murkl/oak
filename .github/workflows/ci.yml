# One binary, checked and built once. A tag is the same run with a release at
# the end of it, so what is published is the file the checks ran against.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

# Keyed so a branch and its pull request share one group: only the newer of the
# two runs. On main and on a tag nothing is cancelled — that is the run that
# releases.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `make check` and nothing this file adds to it: what is checked lives in the
  # Makefile, so a rule that holds in CI holds at a desk.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout: without git, actions/checkout falls back to a
      # tarball, and then there is no history for a version to come from.
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          # git describe needs the tags to describe anything.
          fetch-depth: 0

      # gcc is for the race detector below, which is built on cgo.
      - uses: ./.github/actions/arch
        with:
          packages: go gcc make shellcheck shfmt staticcheck yamllint actionlint gettext diffutils

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('go.sum') }}-

      - run: make check

      # Once per push rather than once per save: it doubles a test run that
      # already takes over a minute.
      - name: Tests under the race detector
        run: make test-race

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v7

      - uses: ./.github/actions/arch
        with:
          packages: go make govulncheck gitleaks

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('go.sum') }}-

      - name: Vulnerabilities
        run: make vuln

      # A binary built here is downloaded and run by other projects' builds. A
      # credential that reached this repository would travel with it.
      - name: Secrets in the repository
        run: gitleaks dir . --redact --no-banner

  # The only job that compiles anything. The release below publishes this
  # artefact rather than building again.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/arch
        with:
          packages: go make

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('go.sum') }}-

      - run: make release

      # What ships is what the checks ran against. A binary with nothing beside
      # it can still answer for itself, which is the whole of what this asks.
      - name: The binary is whole and says what it is
        run: |
          cd bin && sha256sum -c ./*.sha256
          ./oak-linux-amd64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: binary
          path: bin/
          retention-days: 7

  # Nothing is built here. A tag publishes the artefact the jobs above checked
  # and built — the same bytes, under a version.
  release:
    name: Release
    needs: [check, security, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # the provenance below is signed
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binary
          path: dist

      # Skipped rather than failed when it exists, so re-running a half-finished
      # run finishes it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION is already published"
            exit 0
          fi
          gh release create "$VERSION" dist/* \
            --title "Oak $VERSION" \
            --generate-notes

      # Which commit and which run this file came out of, signed.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/oak-linux-amd64
