# Pull requests are checked, main releases. Which job runs when is the table in
# docs/CONTRIBUTING.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# A new push replaces a pull request's run; main queues, so no release is cut
# short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release pull request, or once that is merged, the tag and a draft page.
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release branch, the tag and the page
      pull-requests: write # the release pull request
    outputs:
      version: ${{ steps.please.outputs.version }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: please

  # `make check` on today's Arch, as at a desk. On main only for a release: the
  # pull request checked everything else.
  check:
    name: Check
    needs: release
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release.outputs.version != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:latest # zizmor: ignore[unpinned-images] - upgraded below
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      # Restored everywhere, saved on main only: a pull request's cache serves
      # no other pull request.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/cache/pacman/pkg
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-

      # gcc for the race detector.
      - run: |
          pacman -Syu --needed --noconfirm git pacman-contrib go gcc make shellcheck shfmt \
            yamllint actionlint zizmor gettext diffutils gitleaks govulncheck
          paccache -rk1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: make check ${RELEASE:+VERSION="$RELEASE"}

      - run: make vuln

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            /var/cache/pacman/pkg
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ github.job }}-${{ github.run_id }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.RELEASE != ''
        with:
          name: oak
          path: bin/oak-linux-amd64
          if-no-files-found: error
          retention-days: 1

  # The binary the check built, signed and hung on the draft, which goes public
  # last.
  publish:
    name: Publish
    needs: [release, check]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the asset and the page
      id-token: write # signs the provenance
      attestations: write # stores it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oak

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: oak-linux-amd64

      - run: |
          gh release upload "$TAG" oak-linux-amd64 --clobber
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
