# One binary, checked and built once. A tag is the same run with a release at
# the end of it, so what is published is the file the checks ran against.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

# One run per pull request: pushing again cancels the one still going. On main
# and on a tag nothing is cancelled — that is the run that releases.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `make check` and nothing this file adds to it: what is checked lives in the
  # Makefile, so a rule that holds in CI holds at a desk. The binary it builds
  # on the way through is the one the release publishes — checked and shipped
  # are the same bytes because they are the same build.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout: without git, actions/checkout falls back to a
      # tarball, and then there is no history for a version to come from. A
      # full upgrade rather than a refresh, because installing against a
      # database newer than the system is the one thing Arch does not carry.
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          # git describe needs the tags to describe anything.
          fetch-depth: 0
          persist-credentials: false

      # gcc is for the race detector below, which is built on cgo.
      - uses: ./.github/actions/arch
        with:
          packages: go gcc make shellcheck shfmt staticcheck yamllint actionlint gettext diffutils

      - run: make check

      # Once per push rather than once per save: it doubles a test run that
      # already takes over a minute.
      - name: Tests under the race detector
        run: make test-race

      # A binary with nothing beside it can still answer for itself, which is
      # the whole of what this asks.
      - name: The binary is whole and says what it is
        run: |
          cd bin && sha256sum -c ./*.sha256
          ./oak-linux-amd64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: binary
          path: bin/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/arch
        with:
          packages: go make govulncheck gitleaks

      - name: Vulnerabilities
        run: make vuln

      # A binary built here is downloaded and run by other projects' builds. A
      # credential that reached this repository would travel with it.
      - name: Secrets in the repository
        run: gitleaks dir . --redact --no-banner

  # Nothing is built here. A tag publishes the artefact the jobs above checked
  # and built — the same bytes, under a version.
  release:
    name: Release
    needs: [check, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # the provenance below is signed
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: binary
          path: dist

      # The last thing between a tag and a download link. The tag has to be a
      # release tag, and the binary about to be published under it has to
      # answer to exactly that — the same rule `make version-check` applies at
      # a desk before the tag is ever pushed.
      - name: The tag is the version the binary answers to
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)

          # An artefact comes back without the bit it went up with: uploading
          # does not carry file permissions, and the next line runs the file.
          chmod +x dist/oak-linux-amd64
          make version-check TAG="$VERSION" BIN=dist/oak-linux-amd64

      # Two ways in, one outcome. A tag pushed from a terminal has no release
      # yet, so this writes one; a release published from the web page has the
      # tag and the notes already, so this only hangs the binary on it. Either
      # way the step can be run again on a half-finished run.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "Oak $VERSION" \
              --generate-notes
          fi

      # Which commit and which run this file came out of, signed.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/oak-linux-amd64
