# The toolchain every job runs on, and the caches that keep a run cheap: the
# packages it is assembled from, and what Go leaves behind between builds.
#
# Everything runs on Arch: every tool this project checks itself with is a
# package there. CI ends up running the literal commands from the Makefile
# rather than an approximation assembled out of setup actions.

name: Arch toolchain
description: An Arch container with the given packages, from cache where possible.

inputs:
  packages:
    description: Packages to install, separated by spaces.
    required: true

runs:
  using: composite
  steps:
    # A key nothing can hit, over a prefix that almost always does: the restore
    # takes the newest cache this job wrote, and the save at the end writes a
    # fresh one.
    - uses: actions/cache@v6
      with:
        path: /var/cache/pacman/pkg
        key: pacman-${{ github.job }}-${{ github.run_id }}
        restore-keys: pacman-${{ github.job }}-

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -ra packages <<<"$PACKAGES"
        pacman -Syu --needed --noconfirm pacman-contrib "${packages[@]}"

        # Two versions of each package is plenty to restore from, and keeps a
        # cache written on every run from growing without end.
        paccache -rk2 -q

        # The checkout belongs to the runner's user and this container is root,
        # which git reads as somebody else's repository. The version comes out
        # of `git describe`, so it has to be able to.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Every job here compiles the module, so every job wants what the last one
    # left. It belongs with the toolchain rather than beside each job, so there
    # is one definition of what a job arrives with.
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
        restore-keys: go-${{ github.job }}-${{ hashFiles('go.sum') }}-
