# Dependencies and actions, kept current without anybody remembering to.
#
# Every pull request here is titled the way title.yml demands of any other, or
# it could never be merged: `build(deps): bump …` for what the binary is built
# from, `ci: bump …` for what the workflows run on.

version: 2

# A week before any release is taken: a compromised one is usually pulled again
# within days, and one taken the hour it appears is the one that gets in.

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope

  # The workflows, and the composite action they all run on. Dependabot reads
  # one folder per entry, and an action outside .github/workflows is its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  - package-ecosystem: github-actions
    directory: /.github/actions/arch
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
