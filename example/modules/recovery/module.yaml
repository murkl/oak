# A second module, so the interface asks which one to open.

title: Tux Recovery

stages: [check]

rules:
  on-success: [shell]

variables:
  - name: TUX_TARGET
    type: text
    title: System folder
    description: The tree to check.
    group: Storage
    required: true
    default: ./tux

  # Read off the tree rather than asked, never stored.
  - name: TUX_DESKTOP
    type: text
    title: Desktop
    description: Which desktop the tree was built with.
    group: Storage
    value-from: value_desktop()
