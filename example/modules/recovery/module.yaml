# A second module, and a second whole program out of the same binary. Its being
# here is the only reason the interface asks which one to open: one folder under
# modules/ is opened on the way in, two make a page.
#
# It has no module.sh: a module that shares nothing between its scripts simply
# leaves the file out.

title: Tux Recovery
description: Check a system tree that is already there.

stages: [check]

confirm: |
  {{TUX_TARGET}} will be checked. Nothing is written.

console: Run ./oak --module=recovery to check it again.

variables:
  # Its own answer, in its own file: recovery.conf sits beside setup.conf and
  # neither module can see into the other.
  - name: TUX_TARGET
    title: System folder
    description: |
      The tree to check.
    group: Storage
    required: true
    default: ./tux

  # Not a question but a fact, so it is worked out rather than asked: what the
  # tree itself says it was built with. It is read when the module opens and
  # again whenever an answer changes, so naming another folder above changes
  # this too.
  #
  # Such a variable is never asked, never on the settings page and never written
  # to the answer file - the next run reads it off the machine again, and a
  # stored copy could only disagree with it.
  - name: TUX_DESKTOP
    title: Desktop
    description: |
      Which desktop the tree was built with.
    group: Storage
    answer: cat "${TUX_TARGET}/etc/desktop" 2>/dev/null || echo none
