# An installer in miniature: it asks what an installer asks and builds a small
# system tree in a folder, so it runs on the machine you read this on.

title: Tux Setup
description: Build a small Linux system tree, the way an installer would.

# The words of its own pages: the row that starts the work, and the last page
# before it, filled in from the answers.
text:
  start: Install
  confirm: |
    Build the system tree in {{TUX_TARGET}}?

    Files already there under the same names are overwritten.

# Each a folder under tasks/, marked: tasks/@install/.
stages: [prepare, install, finish]

# Each a folder under actions/.
rules:
  start-if: [writable]
  on-settings: [note]
  on-success: [shell]

variables:
  # prefill suggests and Oak still asks; a default would answer.
  - name: TUX_HOST
    title: Hostname
    description: What the machine calls itself on the network.
    group: System
    required: true
    prefill: suggest_hostname()
    pattern: '^[a-z][a-z0-9-]*$'
    error: Lower case letters, digits and - only.

  - name: TUX_USER
    title: User name
    description: The account you log in with.
    group: System
    required: true
    pattern: '^[a-z][a-z0-9-]*$'
    error: Lower case letters, digits and - only.

  - name: TUX_DESKTOP
    title: Desktop
    description: Which desktop to install. Without one the system boots to a console.
    group: System
    required: true
    options: [gnome, plasma, none]

  # Answered by its default, so it is never asked, only changed in the settings.
  - name: TUX_TARGET
    title: Target folder
    description: Where the system tree is built. A real installer names a disk here.
    group: Storage
    required: true
    default: ./tux
