# Named under menu: a row between Install and Settings. Opening it asks its one
# page and hands the answer to action.sh beside this file. It is kept for this
# session only: never on the settings page, never in setup.conf.
title: Leave a note
description: Write a line for whoever logs in to the tree first.

variable:
  name: TUX_NOTE
  title: Note
  description: What the tree greets its first login with.
  default: Welcome to Tux.
