# Named under rules: settings, a row at the top of the settings page. Opening it
# asks its one page and hands the answer to action.sh beside this file. The
# answer is kept for this session only: never a row of its own, never in
# setup.conf.
title: Leave a note
description: Write a line for whoever logs in to the tree first.

variable:
  name: TUX_NOTE
  title: Note
  description: What the tree greets its first login with.
  default: Welcome to Tux.
