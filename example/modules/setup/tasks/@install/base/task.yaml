title: Install the base system

# Short enough to read here, so there is no test.sh beside this file. The other
# form is a single line naming one: `test: ./verify.sh`.
#
# The guard is the task's own: a simulated run wrote nothing, and a test that
# does not say so fails for the one reason that is not a fault.
test: |
  simulating && return 0

  grep -q "^$TUX_HOST$" "$TUX_TARGET/etc/hostname"
  grep -q '^ID=tux$' "$TUX_TARGET/etc/os-release"
