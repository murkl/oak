# One module: what it is, what it asks, and the order its work happens in.
#
# The folder name is the module's identity. `oak hello` opens it outright, and
# its answers and its log are called hello.conf and hello.log.

title: Demo Setup
description: Write a greeting to a file.
run: Setup

# The phases the work happens in, in the order they happen. Every task names
# one, which is what puts it in the run and where.
stages: [prepare, write]

# The last thing read before the first task runs, with the answers filled in.
confirm: |
  A greeting for {{DEMO_NAME}} will be written to {{DEMO_TARGET}}.

# Shown on the terminal on the way out, once the interface is gone.
console: Run ./oak hello to start it again.

variables:
  - name: DEMO_NAME
    title: Your name
    description: |
      Who the greeting is for.
    group: Greeting
    required: true
    pattern: '^[A-Za-z][A-Za-z -]*$'
    error: Letters, spaces and - only.

  # A list, because the answers are written down. Without them this would be a
  # text box, and with a command: it would be a list built from what that
  # command printed.
  - name: DEMO_GREETING
    title: Greeting
    description: |
      How the line opens.
    group: Greeting
    values: [Hello, Hi, Good morning]
    default: Hello

  - name: DEMO_TARGET
    title: File
    description: |
      Where the greeting is written.
    group: Output
    required: true
    default: ./greeting.txt
