# What this product is, in the few things no module can answer for its
# neighbours: the name over the pages drawn before one has been opened, the one
# colour the interface is built from, the wordmark it comes up out of, where the
# rest of it lives, and what this build of it is called.
#
# Which modules there are is not written down here. They are the folders in
# modules/ beside this file, each holding its own declaration.

title: Oak
version: 1.0.0

# Where the rest of the product is. The welcome page writes it out, for the
# machine that is being installed and has no browser on it yet.
url: https://github.com/murkl/oak

# Every colour on screen is derived from this one.
accent: "#8fbcbb"

# Above the blank line is the eyebrow, dimmed; below it the wordmark, in the
# accent colour. Underneath, Oak signs the splash off with its own version.
logo: |
